[package]
name = "vbsp"
version = "0.9.1"
authors = ["Robin Appelman <robin@icewind.nl>"]
homepage = "https://codeberg.org/icewind/vbsp"
repository = "https://codeberg.org/icewind/vbsp"
description = "Rust parser for valve bsp files."
license = "MIT"
edition = "2024"
readme = "README.md"
exclude = ["*.bsp"]
rust-version = "1.85.0"

[dependencies]
qbsp = { git = "https://github.com/eira-fransham/qbsp.git" }
vbsp-common = { version = "0.1.0", path = "common" }
arrayvec = "0.7.6"
bitflags = "2.8.0"
bit-vec = "0.9"
glam = "0.30"
thiserror = "2.0.11"
lzma-rs = "0.3.0"
binrw = "0.14.1"
static_assertions = "1.1.0"
num_enum = "0.7.3"
tracing = "0.1"
zip = "8.2"
itertools = "0.14.0"
image = "0.25"
ahash = "0.8.11"
serde = "1.0.218"
vdf-reader = "0.3.0"

[dev-dependencies]
obj = "0.10"
main_error = "0.1.2"
criterion = "0.5.1"
vbsp-entities-tf2 = { version = "0.1.0-egg" }

# [patch."https://github.com/eira-fransham/qbsp.git"]
# qbsp = { path = "../qbsp" }

[profile.dev]
opt-level = 2

[[bench]]
name = "bench"
harness = false

[workspace]
members = ["common"]
